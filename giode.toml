# giode.toml configures how the giode CLI builds this app.
# Reference: https://github.com/mehran9675/giode-cli#giodetoml

[app]
name = "Silicon DB"
id = "com.mehran9675.silicondb"
version = "1.0.0"
build = 1
icon = "assets/icon.png"
package = "."
publisher = "Silicon DB"
description = "Specifications of processors, GPUs, SoCs, AI accelerators and other chips."
website = "https://github.com/xmhrnx/silicondb"
platforms = ["android", "ios"]
licenses = "assets/licenses.json"

[android]
min_sdk = 24
keystore = "release.keystore"      # written by the release workflow from ANDROID_KEYSTORE_BASE64
permissions = ["network"]

[ios]
min_os = 15

[ci]
trigger = "release"
test = "go run ./cmd/indexgen -check && go test ./internal/model/... ./internal/data/... ./internal/format/... ./internal/store/..."

[ci.setup]
# GitHub's Ubuntu runners have the Android SDK but not bundletool, which
# building the Play Store bundle (aab) needs; put it in the newest build-tools.
linux = '''
bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
sudo cp "$RUNNER_TEMP/bundletool.jar" "$bt/bundletool.jar"
'''
