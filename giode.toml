# giode.toml configures how the giode CLI builds this app.
# Reference: https://github.com/mehran9675/giode-cli#giodetoml

[app]
name = "Silicon DB"
id = "com.mehran9675.silicondb"
version = "1.0.0"
build = 1
icon = "assets/icon.png"
package = "."
publisher = "Silicon DB"
description = "Specifications of every processor, GPU, SoC and AI accelerator since the Intel 8008."
website = "https://github.com/Mehran9675/silicondb"

[android]
min_sdk = 24
permissions = ["network"]

[ios]
min_os = 15

[windows]
arch = "amd64"

[linux]
categories = ["Education", "Science"]

[web]
port = 8080
